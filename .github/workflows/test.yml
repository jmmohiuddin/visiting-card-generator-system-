# The full suite, against a real Postgres.
#
# The Netlify build runs `npm run test:deploy`, which cannot start a database
# and says so loudly. This is where the schema guarantees are actually
# enforced: every push and every pull request, with Postgres 16 running as a
# service, so `tests/entitlements.test.mjs` sections 7 and 8 execute for real.
#
# Three other suites — library, metrics, pinning — also run more assertions
# when a database is present. Without one they pass with fewer, which is the
# quieter version of the same problem, and the reason this workflow exists
# rather than trusting a green local run.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Three suites, three conventions, and satisfying only one of them buys
      # a green run that quietly checked less. entitlements reads
      # CARDWORKS_TEST_PG; metrics reads CARDWORKS_TEST_DATABASE_URL; pinning
      # and library build a URL from $USER against 127.0.0.1 with no variable
      # at all. The first CI run passed while library and metrics were
      # skipping — 166 and 64 assertions against 183 and 108 locally — which
      # is exactly the silent under-run this workflow exists to prevent.
      # CARDWORKS_TEST_DATABASE_URL is deliberately NOT set. metrics treats it
      # as "this database already exists and is migrated" and skips creating
      # one — pointing it at a database that did not exist is what kept that
      # suite at 64 assertions instead of 108. Left unset, it builds and drops
      # its own, which is what the `runner` role below is for.
      CARDWORKS_TEST_PG: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PGHOST: 127.0.0.1
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: A role named after the runner, for the suites that assume one
        # pinning and library connect as $USER — `runner` on GitHub-hosted
        # machines — with no way to override it. Give Postgres that role
        # rather than leaving those suites to skip.
        run: |
          psql -U postgres -d postgres -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='runner')
             THEN CREATE ROLE runner LOGIN SUPERUSER CREATEDB PASSWORD 'postgres'; END IF; END \$\$;"
          psql -U postgres -d postgres -c "SELECT rolname, rolcreatedb FROM pg_roles WHERE rolname IN ('runner','postgres');"

      - name: Full suite, with a database
        run: npm test
