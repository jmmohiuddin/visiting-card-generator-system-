document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { adow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg x;gap:12px;align-items:baseline;padding:11px 20px;border-bottom:1px solid var(--color-divider);background:transparent;border-left:0;border-right:0;border-top:0;cursor:pointer;text-align:left;font-family:var(--font-body);font-size:13px;width:100%}\n.cw-railitem:hover{background:color-mix(in srgb, var(--color-text) 6%, transparent)}\n.cw-num{font-family:var(--font-heading);font-weight:800;font-size:10px;letter-spacing:.1em}\n.cw-tile{cursor:pointer}\n.cw-tile:hover .cw-tilehd{color:var(--color-accent)}\n@keyframes cwpulse{0%{opacity:.25}50%{opacity:1}100%{opacity:.25}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--color-bg);color:var(--color-text)\">\n<div style=\"max-width:1440px;margin:0 auto;border-left:2px solid var(--color-divider);border-right:2px solid var(--color-divider);min-height:100vh;background:var(--color-bg)\">\n\n<div class=\"nav\">\n<div class=\"nav-brand\">CARDWORKS<\u002Fdiv>\n<div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-right:auto\">{{ crumb }}<\u002Fdiv>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goIntake }}\">Brief<\u002Fbutton>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goResults }}\">Concepts<\u002Fbutton>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goEditor }}\">Editor<\u002Fbutton>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goValidate }}\">Validate<\u002Fbutton>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goExport }}\">Export<\u002Fbutton>\n<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goStart }}\">Start<\u002Fbutton>\n<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goLibrary }}\">Library<\u002Fbutton>\n<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goDashboard }}\">My designs<\u002Fbutton>\n<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goAdmin }}\">Studio<\u002Fbutton>\n<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goPricing }}\">Plans<\u002Fbutton>\n<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goSignin }}\">Sign in<\u002Fbutton>\n<div style=\"width:32px;height:32px;background:var(--color-neutral-300);margin-left:8px\"><\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ isIntake }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:grid;grid-template-columns:280px 1fr 300px;min-height:calc(100vh - 62px)\">\n\n<div class=\"cw-rail\">\n<div style=\"padding:20px;border-bottom:2px solid var(--color-divider)\">\n<h6 style=\"margin:0\">The brief<\u002Fh6>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:6px\">Twelve short steps. Nothing about typography, bleed or CMYK.<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ rail }}\" as=\"r\" hint-placeholder-count=\"12\">\n<button class=\"cw-railitem\" sc-camel-on-click=\"{{ r.go }}\" style=\"{{ r.style }}\"><span class=\"cw-num\">{{ r.num }}<\u002Fspan><span>{{ r.label }}<\u002Fspan><span style=\"{{ r.markStyle }}\">{{ r.mark }}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"padding:38px 44px\">\n\n<sc-if value=\"{{ step1 }}\" hint-placeholder-val=\"{{ true }}\">\n<h6 style=\"color:var(--color-accent)\">Step 01<\u002Fh6>\n<h1 style=\"margin-bottom:10px\">Tell us about yourself<\u002Fh1>\n<p style=\"max-width:520px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">This is the only part that has to be exact. Everything after it is a preference, and we can change our mind later.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;max-width:640px\">\n<div class=\"field\"><label>Full name<\u002Flabel><input class=\"input\" value=\"Mohiuddin Ahmed\"><\u002Fdiv>\n<div class=\"field\"><label>Job title<\u002Flabel><input class=\"input\" value=\"Chief Executive Officer\"><\u002Fdiv>\n<div class=\"field\"><label>Company<\u002Flabel><input class=\"input\" value=\"NOVA Technologies\"><\u002Fdiv>\n<div class=\"field\"><label>Industry<\u002Flabel><input class=\"input\" value=\"Technology\"><\u002Fdiv>\n<div class=\"field\"><label>Phone<\u002Flabel><input class=\"input\" value=\"+971 50 214 8890\"><\u002Fdiv>\n<div class=\"field\"><label>Email<\u002Flabel><input class=\"input\" value=\"m.ahmed@novatech.ae\"><\u002Fdiv>\n<div class=\"field\" style=\"grid-column:span 2\"><label>Tagline — optional<\u002Flabel><input class=\"input\" placeholder=\"Leave blank and we will suggest one\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ step4 }}\" hint-placeholder-val=\"{{ false }}\">\n<h6 style=\"color:var(--color-accent)\">Step 02<\u002Fh6>\n<h1 style=\"margin-bottom:10px\">Where can people reach you?<\u002Fh1>\n<p style=\"max-width:540px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Add everything you have. We decide what earns a place on the card and what moves to the QR code — more than five contact routes and none of them get read.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;max-width:640px\">\n<div class=\"field\"><label>Website<\u002Flabel><input class=\"input\" value=\"novatech.ae\"><\u002Fdiv>\n<div class=\"field\"><label>Office address<\u002Flabel><input class=\"input\" value=\"Dubai Internet City, UAE\"><\u002Fdiv>\n<div class=\"field\"><label>WhatsApp<\u002Flabel><input class=\"input\" value=\"+971 50 214 8890\"><\u002Fdiv>\n<div class=\"field\"><label>LinkedIn<\u002Flabel><input class=\"input\" value=\"in/mohiuddin-ahmed\"><\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:36px;max-width:720px\">\n<div>\n<h6>QR code<\u002Fh6>\n<div style=\"display:flex;flex-direction:column;gap:11px;margin-top:12px\">\n<label class=\"radio\"><input type=\"radio\" name=\"qr\" sc-camel-default-checked=\"{{ yes }}\"><span class=\"dot\"><\u002Fspan>Contact card — saves to the phone<\u002Flabel>\n<label class=\"radio\"><input type=\"radio\" name=\"qr\"><span class=\"dot\"><\u002Fspan>Website<\u002Flabel>\n<label class=\"radio\"><input type=\"radio\" name=\"qr\"><span class=\"dot\"><\u002Fspan>Calendar booking link<\u002Flabel>\n<label class=\"radio\"><input type=\"radio\" name=\"qr\"><span class=\"dot\"><\u002Fspan>No QR code<\u002Flabel>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:12px\">A QR needs 12 mm clear. On a 85 × 55 mm card that is a quarter of one side, so we place it on the back unless the concept is built around it.<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h6>What lands on the front<\u002Fh6>\n<div style=\"border-top:1px solid var(--color-divider);margin-top:12px\">\n<sc-for list=\"{{ hierarchy }}\" as=\"h\" hint-placeholder-count=\"5\">\n<div style=\"display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--color-divider)\">\n<span class=\"cw-num\" style=\"color:var(--color-accent);width:16px\">{{ h.rank }}<\u002Fspan>\n<span style=\"font-size:13px;flex:1\">{{ h.field }}<\u002Fspan>\n<span style=\"{{ h.tagStyle }}\">{{ h.where }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:12px\">Ordered for a chief executive: the name outranks the phone number. A property consultant would see this list inverted.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ step5 }}\" hint-placeholder-val=\"{{ false }}\">\n<h6 style=\"color:var(--color-accent)\">Step 03<\u002Fh6>\n<h1 style=\"margin-bottom:10px\">Your brand<\u002Fh1>\n<p style=\"max-width:540px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">If you have a logo, we read it. If you do not, we set your name in type and skip the mark entirely — an invented logo is worse than none.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:flex;gap:24px;align-items:flex-start;max-width:720px\">\n<div style=\"width:132px;height:132px;flex:none;border:2px dashed var(--color-divider);display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 45%,transparent);text-align:center;padding:10px\">Drop logo<\u002Fdiv>\n<div style=\"flex:1\">\n<h5 style=\"margin-bottom:6px\">nova-mark.svg<\u002Fh5>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)\">\n<div style=\"padding:12px 14px 12px 0;border-right:1px solid var(--color-divider)\"><h6>Type<\u002Fh6><div style=\"font-size:13px\">Symbol + wordmark<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:12px 14px;border-right:1px solid var(--color-divider)\"><h6>Ratio<\u002Fh6><div style=\"font-size:13px\">3.4 : 1<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:12px 14px;border-right:1px solid var(--color-divider)\"><h6>Colours<\u002Fh6><div style=\"display:flex;gap:4px;margin-top:4px\"><span style=\"width:18px;height:18px;background:#0d0d0c;display:block\"><\u002Fspan><span style=\"width:18px;height:18px;background:#c9a227;display:block\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"padding:12px 0 12px 14px\"><h6>Min size<\u002Fh6><div style=\"font-size:13px\">14 mm wide<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:flex-start;margin-top:14px;border-left:3px solid var(--color-accent);padding-left:12px\">\n<div style=\"font-size:13px;max-width:420px\">The inner counter closes below 14 mm. Concepts that place the mark small will use the symbol on its own, and we generate light, dark and single-colour versions automatically.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:36px;max-width:720px\">\n<div>\n<h6>Brand colours<\u002Fh6>\n<div style=\"display:flex;gap:10px;margin-top:12px\">\n<sc-for list=\"{{ brandColors }}\" as=\"b\" hint-placeholder-count=\"3\">\n<div><div style=\"{{ b.sw }}\"><\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;margin-top:5px\">{{ b.hex }}<\u002Fdiv><div style=\"font-size:10px;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">{{ b.role }}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<button class=\"cw-chip\" sc-camel-on-click=\"{{ noop }}\" style=\"height:44px\">+ Add<\u002Fbutton>\n<\u002Fdiv>\n<h6 style=\"margin-top:24px\">Colours to avoid<\u002Fh6>\n<div style=\"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap\"><span class=\"tag tag-neutral\">Competitor blue<\u002Fspan><span class=\"tag tag-neutral\">Pastels<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h6>Typefaces<\u002Fh6>\n<div style=\"display:flex;flex-direction:column;gap:11px;margin-top:12px\">\n<label class=\"radio\"><input type=\"radio\" name=\"font\" sc-camel-default-checked=\"{{ yes }}\"><span class=\"dot\"><\u002Fspan>Let the system choose<\u002Flabel>\n<label class=\"radio\"><input type=\"radio\" name=\"font\"><span class=\"dot\"><\u002Fspan>Match my brand fonts<\u002Flabel>\n<label class=\"radio\"><input type=\"radio\" name=\"font\"><span class=\"dot\"><\u002Fspan>Upload a licensed font file<\u002Flabel>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:12px\">Uploaded fonts are used for rendering only and are outlined in the print file, so no licence travels to the press.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ step2 }}\" hint-placeholder-val=\"{{ false }}\">\n<h6 style=\"color:var(--color-accent)\">Step 04<\u002Fh6>\n<h1 style=\"margin-bottom:10px\">How should your card feel?<\u002Fh1>\n<p style=\"max-width:560px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Pick up to three. This is the single strongest signal we have — it decides the palette, the typography and the finish before anything is drawn.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;max-width:720px\">\n<sc-for list=\"{{ vibes }}\" as=\"v\" hint-placeholder-count=\"18\">\n<button class=\"cw-chip\" sc-camel-on-click=\"{{ v.toggle }}\" style=\"{{ v.style }}\">{{ v.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:18px;font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ vibeCount }}<\u002Fdiv>\n<hr class=\"hr\">\n<h5>What this changes<\u002Fh5>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--color-divider);max-width:720px\">\n<div style=\"padding:14px 16px 14px 0;border-right:1px solid var(--color-divider)\"><h6>Palette<\u002Fh6><div style=\"font-size:13px\">{{ effPalette }}<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:14px 16px;border-right:1px solid var(--color-divider)\"><h6>Typography<\u002Fh6><div style=\"font-size:13px\">{{ effType }}<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:14px 0 14px 16px\"><h6>Finish<\u002Fh6><div style=\"font-size:13px\">{{ effFinish }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ step6 }}\" hint-placeholder-val=\"{{ false }}\">\n<h6 style=\"color:var(--color-accent)\">Step 05<\u002Fh6>\n<h1 style=\"margin-bottom:10px\">Visual direction<\u002Fh1>\n<p style=\"max-width:540px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Four preferences, all optional. Skip them and the concepts explore the full range that your personality allows.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"max-width:760px\">\n<h6>Colour<\u002Fh6>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);margin-top:10px\">\n<label class=\"radio\" style=\"padding:16px 20px 16px 0;border-right:1px solid var(--color-divider);align-items:flex-start\"><input type=\"radio\" name=\"cmode\" sc-camel-default-checked=\"{{ yes }}\"><span class=\"dot\" style=\"margin-top:3px\"><\u002Fspan><span><span style=\"font-weight:600\">Choose for me<\u002Fspan><span style=\"display:block;font-size:12.5px;color:color-mix(in srgb,var(--color-text) 58%,transparent);margin-top:3px\">Palettes derived from your logo, industry and the price you want the card to imply.<\u002Fspan><\u002Fspan><\u002Flabel>\n<label class=\"radio\" style=\"padding:16px 0 16px 20px;align-items:flex-start\"><input type=\"radio\" name=\"cmode\"><span class=\"dot\" style=\"margin-top:3px\"><\u002Fspan><span><span style=\"font-weight:600\">I will pick<\u002Fspan><span style=\"display:block;font-size:12.5px;color:color-mix(in srgb,var(--color-text) 58%,transparent);margin-top:3px\">Set main, secondary and accent yourself. We still enforce contrast minimums.<\u002Fspan><\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n\n<h6 style=\"margin-top:26px\">Layout emphasis<\u002Fh6>\n<div style=\"display:flex;gap:14px;margin-top:12px;flex-wrap:wrap\">\n<sc-for list=\"{{ layoutPrefs }}\" as=\"l\" hint-placeholder-count=\"5\">\n<button class=\"cw-chip\" sc-camel-on-click=\"{{ l.toggle }}\" style=\"{{ l.style }}\">\n<span style=\"{{ l.thumb }}\"><span style=\"{{ l.bar1 }}\"><\u002Fspan><span style=\"{{ l.bar2 }}\"><\u002Fspan><\u002Fspan>\n<span style=\"display:block;margin-top:8px;font-size:12px\">{{ l.label }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:26px\">\n<div>\n<h6>Information density<\u002Fh6>\n<div class=\"seg\" style=\"margin-top:12px\">\n<label class=\"seg-opt\"><input type=\"radio\" name=\"dens\">Minimal<\u002Flabel>\n<label class=\"seg-opt\"><input type=\"radio\" name=\"dens\" sc-camel-default-checked=\"{{ yes }}\">Balanced<\u002Flabel>\n<label class=\"seg-opt\"><input type=\"radio\" name=\"dens\">Informative<\u002Flabel>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:10px\">Balanced puts name, role and two contact routes on the front; the rest moves to the back.<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h6>Orientation<\u002Fh6>\n<div class=\"seg\" style=\"margin-top:12px\">\n<label class=\"seg-opt\"><input type=\"radio\" name=\"orient\" sc-camel-default-checked=\"{{ yes }}\">Landscape<\u002Flabel>\n<label class=\"seg-opt\"><input type=\"radio\" name=\"orient\">Portrait<\u002Flabel>\n<label class=\"seg-opt\"><input type=\"radio\" name=\"orient\">Square<\u002Flabel>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:10px\">Square costs more — it is cut from the same sheet with more waste.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ step3 }}\" hint-placeholder-val=\"{{ false }}\">\n<h6 style=\"color:var(--color-accent)\">Step 06<\u002Fh6>\n<h1 style=\"margin-bottom:10px\">How should it feel in the hand?<\u002Fh1>\n<p style=\"max-width:560px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Paper and finish are half of what people remember about a card. Choose by feel; we translate it into stock weights and press specifications.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:36px;max-width:720px\">\n<div>\n<h6>Paper<\u002Fh6>\n<div style=\"display:flex;flex-direction:column;gap:11px;margin-top:12px\">\n<label class=\"radio\"><input type=\"radio\" name=\"paper\"><span class=\"dot\"><\u002Fspan>Standard matte<\u002Flabel>\n<label class=\"radio\"><input type=\"radio\" name=\"paper\"><span class=\"dot\"><\u002Fspan>Soft-touch<\u002Flabel>\n<label class=\"radio\"><input type=\"radio\" name=\"paper\" sc-camel-default-checked=\"{{ yes }}\"><span class=\"dot\"><\u002Fspan>Cotton<\u002Flabel>\n<label class=\"radio\"><input type=\"radio\" name=\"paper\"><span class=\"dot\"><\u002Fspan>Linen texture<\u002Flabel>\n<label class=\"radio\"><input type=\"radio\" name=\"paper\"><span class=\"dot\"><\u002Fspan>Recycled kraft<\u002Flabel>\n<\u002Fdiv>\n<h6 style=\"margin-top:24px\">Thickness<\u002Fh6>\n<div class=\"seg\" style=\"margin-top:12px\">\n<label class=\"seg-opt\"><input type=\"radio\" name=\"thick\">Standard<\u002Flabel>\n<label class=\"seg-opt\"><input type=\"radio\" name=\"thick\">Thick<\u002Flabel>\n<label class=\"seg-opt\"><input type=\"radio\" name=\"thick\" sc-camel-default-checked=\"{{ yes }}\">Premium<\u002Flabel>\n<label class=\"seg-opt\"><input type=\"radio\" name=\"thick\">Luxury<\u002Flabel>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:10px\">Premium = 450 gsm cotton, 0.55 mm. Noticeably stiff, still fits a wallet.<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h6>Finishing<\u002Fh6>\n<div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-top:12px\">\n<sc-for list=\"{{ finishes }}\" as=\"f\" hint-placeholder-count=\"8\">\n<button class=\"cw-chip\" sc-camel-on-click=\"{{ f.toggle }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:22px;border:2px solid var(--color-accent);padding:16px\">\n<h6 style=\"color:var(--color-accent);margin:0 0 8px\">Recommended for you<\u002Fh6>\n<div style=\"font-size:13.5px;line-height:1.5\">{{ finishRecText }}<\u002Fdiv>\n<div style=\"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap\"><span class=\"tag tag-accent\">Producible at 3 of 4 partner presses<\u002Fspan><span class=\"tag tag-neutral\">Adds ~18% to unit cost<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ step7 }}\" hint-placeholder-val=\"{{ false }}\">\n<h6 style=\"color:var(--color-accent)\">Step 07<\u002Fh6>\n<h1 style=\"margin-bottom:10px\">Where will it be printed?<\u002Fh1>\n<p style=\"max-width:540px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Card sizes are regional. Choosing the market sets the trim size, and everything after this is composed against it.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:36px;max-width:760px\">\n<div>\n<h6>Market<\u002Fh6>\n<div style=\"border-top:1px solid var(--color-divider);margin-top:12px\">\n<sc-for list=\"{{ markets }}\" as=\"m\" hint-placeholder-count=\"6\">\n<label class=\"radio\" style=\"display:flex;padding:11px 0;border-bottom:1px solid var(--color-divider);width:100%\"><input type=\"radio\" name=\"market\" sc-camel-default-checked=\"{{ m.checked }}\"><span class=\"dot\"><\u002Fspan><span style=\"flex:1\">{{ m.name }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ m.size }}<\u002Fspan><\u002Flabel>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h6>Budget<\u002Fh6>\n<div class=\"seg\" style=\"margin-top:12px\">\n<label class=\"seg-opt\"><input type=\"radio\" name=\"budget\">Basic<\u002Flabel>\n<label class=\"seg-opt\"><input type=\"radio\" name=\"budget\">Standard<\u002Flabel>\n<label class=\"seg-opt\"><input type=\"radio\" name=\"budget\" sc-camel-default-checked=\"{{ yes }}\">Premium<\u002Flabel>\n<label class=\"seg-opt\"><input type=\"radio\" name=\"budget\">Luxury<\u002Flabel>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:10px\">Premium unlocks thick stocks, soft-touch and one foil area. Luxury adds embossing, letterpress and edge painting.<\u002Fdiv>\n<h6 style=\"margin-top:24px\">Specification we will build to<\u002Fh6>\n<sc-raw-table class=\"table\" style=\"margin-top:10px\">\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"width:44%\">Trim<\u002Fsc-raw-td><sc-raw-td>85 × 55 mm<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Bleed<\u002Fsc-raw-td><sc-raw-td>3 mm each edge<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Safe area<\u002Fsc-raw-td><sc-raw-td>4 mm inside trim<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Colour<\u002Fsc-raw-td><sc-raw-td>CMYK, FOGRA51<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Resolution<\u002Fsc-raw-td><sc-raw-td>300 dpi, vector where possible<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Anything else, in your own words<\u002Fh6>\n<p style=\"font-size:13px;max-width:560px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Optional. This is read as a set of constraints on the composition, not as a design description — so ask for portrait, or a larger name, or fewer contact routes, rather than describing a picture.<\u002Fp>\n<textarea class=\"input\" style=\"max-width:620px;min-height:80px;margin-top:8px\" placeholder=\"Portrait if it works. My name should be the first thing anyone reads. Keep the back almost empty.\"><\u002Ftextarea>\n<div style=\"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;max-width:720px\">\n<sc-for list=\"{{ instrChips }}\" as=\"i\" hint-placeholder-count=\"6\">\n<button class=\"cw-chip\" sc-camel-on-click=\"{{ i.apply }}\" style=\"{{ i.style }}\">{{ i.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<hr class=\"hr\">\n<div style=\"display:flex;gap:10px;align-items:center\">\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ prevStep }}\">Back<\u002Fbutton>\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ nextStep }}\">{{ nextLabel }}<\u002Fbutton>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 50%,transparent);margin-left:8px\">{{ stepHint }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-left:2px solid var(--color-divider);padding:20px\">\n<h6 style=\"margin-bottom:14px\">Reading your brief<\u002Fh6>\n<div style=\"display:flex;flex-direction:column;gap:0;border-top:1px solid var(--color-divider)\">\n<sc-for list=\"{{ briefRows }}\" as=\"b\" hint-placeholder-count=\"6\">\n<div style=\"padding:10px 0;border-bottom:1px solid var(--color-divider)\">\n<div style=\"font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">{{ b.k }}<\u002Fdiv>\n<div style=\"font-size:13px;margin-top:3px\">{{ b.v }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:18px;font-size:12px;line-height:1.55;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">Nothing here is locked. Every answer maps to a set of components, and you can regenerate any single part after the concepts appear.<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isGenerating }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 62px)\">\n<div style=\"padding:60px 44px\">\n<h6 style=\"color:var(--color-accent)\">Step 08<\u002Fh6>\n<h1 style=\"margin-bottom:10px\">Composing concepts<\u002Fh1>\n<p style=\"max-width:440px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">We are not drawing pictures. We are selecting components that are allowed to sit together, then composing them against your brief.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:flex;flex-direction:column;border-top:1px solid var(--color-divider);max-width:480px\">\n<sc-for list=\"{{ pipeline }}\" as=\"p\" hint-placeholder-count=\"7\">\n<div style=\"display:flex;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--color-divider)\">\n<span style=\"{{ p.dot }}\"><\u002Fspan>\n<span style=\"font-size:14px;flex:1\">{{ p.label }}<\u002Fspan>\n<span style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">{{ p.meta }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-left:2px solid var(--color-divider);display:flex;align-items:center;justify-content:center;background:var(--color-surface)\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n<sc-for list=\"{{ ghosts }}\" as=\"g\" hint-placeholder-count=\"4\">\n<div style=\"{{ g.s }}\"><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:34px 44px 60px\">\n<div style=\"display:flex;align-items:flex-end;gap:20px\">\n<div style=\"margin-right:auto\">\n<h6 style=\"color:var(--color-accent)\">Step 09<\u002Fh6>\n<h1 style=\"margin:0\">Six concepts<\u002Fh1>\n<p style=\"margin-top:8px;max-width:560px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Different directions, not variations of one. Each one carries the same brief through a different set of components.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;gap:0\">\n<button class=\"cw-tab\" sc-camel-on-click=\"{{ viewGrid }}\" style=\"{{ sViewGrid }}\">Gallery<\u002Fbutton>\n<button class=\"cw-tab\" sc-camel-on-click=\"{{ viewCompare }}\" style=\"{{ sViewCompare }}\">Compare<\u002Fbutton>\n<\u002Fdiv>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ regenAll }}\">Regenerate all<\u002Fbutton>\n<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goNoResults }}\">Conflict state<\u002Fbutton>\n<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"border:2px solid var(--color-accent);padding:18px 20px\">\n<h6 style=\"color:var(--color-accent);margin:0\">Regenerate with an instruction<\u002Fh6>\n<div style=\"display:flex;gap:10px;margin-top:12px;align-items:center\">\n<input class=\"input\" style=\"flex:1;font-size:15px;min-height:42px\" placeholder=\"Rotate them to portrait, keep the palettes, make the name larger\">\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ regenAll }}\">Regenerate all six<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap\">\n<sc-for list=\"{{ instrChips }}\" as=\"i\" hint-placeholder-count=\"6\">\n<button class=\"cw-chip\" sc-camel-on-click=\"{{ i.apply }}\" style=\"{{ i.style }}\">{{ i.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<sc-if value=\"{{ instrActive }}\" hint-placeholder-val=\"{{ false }}\">\n<button class=\"cw-chip\" sc-camel-on-click=\"{{ clearInstr }}\">Clear<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"font-size:12.5px;line-height:1.55;margin-top:14px;max-width:760px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">{{ instrNote }}<\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n\n<sc-if value=\"{{ gridView }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--color-divider)\">\n<sc-for list=\"{{ concepts }}\" as=\"c\" hint-placeholder-count=\"6\">\n<div class=\"cw-tile\" sc-camel-on-click=\"{{ c.open }}\" style=\"{{ c.tileStyle }}\">\n<dc-import name=\"CardFace\" concept=\"{{ c.data }}\" scale=\"0.74\" side=\"front\" foil=\"{{ c.foil }}\" hint-size=\"326px,186px\"><\u002Fdc-import>\n<div style=\"display:flex;align-items:baseline;gap:10px;margin-top:16px\">\n<span class=\"cw-num\" style=\"color:var(--color-accent)\">{{ c.num }}<\u002Fspan>\n<span class=\"cw-tilehd\" style=\"font-family:var(--font-heading);font-weight:800;font-size:18px\">{{ c.name }}<\u002Fspan>\n<\u002Fdiv>\n<p style=\"font-size:13px;margin:8px 0 12px;color:color-mix(in srgb,var(--color-text) 62%,transparent);max-width:330px\">{{ c.blurb }}<\u002Fp>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:auto\">\n<span class=\"tag tag-neutral\">{{ c.typeName }}<\u002Fspan>\n<span class=\"tag tag-neutral\">{{ c.finishShort }}<\u002Fspan>\n<span class=\"tag tag-outline\">{{ c.complexity }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ compareView }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-top:2px solid var(--color-divider)\">\n<div style=\"display:grid;grid-template-columns:200px 1.2fr 150px 150px 190px 130px;gap:20px;padding:10px 0;border-bottom:2px solid var(--color-divider);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">\n<div>Concept<\u002Fdiv><div>Direction<\u002Fdiv><div>Palette<\u002Fdiv><div>Typography<\u002Fdiv><div>Finish<\u002Fdiv><div>Fit<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ concepts }}\" as=\"c\" hint-placeholder-count=\"6\">\n<div style=\"display:grid;grid-template-columns:200px 1.2fr 150px 150px 190px 130px;gap:20px;padding:18px 0;border-bottom:1px solid var(--color-divider);align-items:center\">\n<div class=\"cw-tile\" sc-camel-on-click=\"{{ c.open }}\"><dc-import name=\"CardFace\" concept=\"{{ c.data }}\" scale=\"0.42\" side=\"front\" hint-size=\"185px,106px\"><\u002Fdc-import><\u002Fdiv>\n<div>\n<div style=\"display:flex;gap:8px;align-items:baseline\"><span class=\"cw-num\" style=\"color:var(--color-accent)\">{{ c.num }}<\u002Fspan><span style=\"font-family:var(--font-heading);font-weight:800;font-size:16px\">{{ c.name }}<\u002Fspan><\u002Fdiv>\n<p style=\"font-size:12.5px;margin:6px 0 0;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">{{ c.blurb }}<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;gap:4px\"><sc-for list=\"{{ c.dots }}\" as=\"d\" hint-placeholder-count=\"4\"><div style=\"{{ d.s }}\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<div style=\"font-size:12.5px\">{{ c.typeName }}<\u002Fdiv>\n<div style=\"font-size:12.5px\">{{ c.finishRec }}<\u002Fdiv>\n<div>\n<div style=\"height:6px;background:var(--color-neutral-300)\"><div style=\"{{ c.fitBar }}\"><\u002Fdiv><\u002Fdiv>\n<div style=\"font-size:11px;margin-top:5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ c.fitLabel }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 420px;min-height:calc(100vh - 62px)\">\n<div style=\"padding:34px 44px\">\n<div style=\"display:flex;align-items:center;gap:12px\">\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goResults }}\">All concepts<\u002Fbutton>\n<div style=\"display:flex\"><button class=\"cw-tab\" sc-camel-on-click=\"{{ showFront }}\" style=\"{{ sFront }}\">Front<\u002Fbutton><button class=\"cw-tab\" sc-camel-on-click=\"{{ showBack }}\" style=\"{{ sBack }}\">Back<\u002Fbutton><\u002Fdiv>\n<div style=\"margin-left:auto;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">85 × 55 mm · UAE standard<\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"display:flex;justify-content:center;padding:34px 0 26px\">\n<dc-import name=\"CardFace\" concept=\"{{ sel.data }}\" scale=\"1.15\" side=\"{{ side }}\" foil=\"{{ layerFoil }}\" uv=\"{{ layerUv }}\" emboss=\"{{ layerEmboss }}\" hint-size=\"506px,289px\"><\u002Fdc-import>\n<\u002Fdiv>\n<div style=\"display:flex;gap:0;justify-content:center;margin-bottom:8px\">\n<button class=\"cw-tab\" sc-camel-on-click=\"{{ toggleFoil }}\" style=\"{{ sFoilBtn }}\">Gold foil<\u002Fbutton>\n<button class=\"cw-tab\" sc-camel-on-click=\"{{ toggleUv }}\" style=\"{{ sUvBtn }}\">Spot UV<\u002Fbutton>\n<button class=\"cw-tab\" sc-camel-on-click=\"{{ toggleEmboss }}\" style=\"{{ sEmbossBtn }}\">Emboss<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"text-align:center;font-size:12px;color:color-mix(in srgb,var(--color-text) 52%,transparent);max-width:520px;margin:10px auto 0\">Simulation only. Each finish exports as its own production layer; the physical result depends on the press and the stock.<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--color-divider)\">\n<sc-for list=\"{{ layerFiles }}\" as=\"l\" hint-placeholder-count=\"4\">\n<div style=\"padding:14px 16px 14px 0;border-right:1px solid var(--color-divider)\">\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px\">{{ l.file }}<\u002Fdiv>\n<div style=\"font-size:11px;color:color-mix(in srgb,var(--color-text) 52%,transparent);margin-top:4px\">{{ l.note }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-left:2px solid var(--color-divider);padding:26px 26px 60px\">\n<div style=\"display:flex;gap:10px;align-items:baseline\"><span class=\"cw-num\" style=\"color:var(--color-accent)\">{{ sel.num }}<\u002Fspan><h3 style=\"margin:0\">{{ sel.name }}<\u002Fh3><\u002Fdiv>\n<p style=\"font-size:13.5px;margin-top:10px;color:color-mix(in srgb,var(--color-text) 66%,transparent)\">{{ sel.blurb }}<\u002Fp>\n<hr class=\"hr\">\n<h6>Why we designed it this way<\u002Fh6>\n<p style=\"font-size:14px;line-height:1.6\">{{ sel.why }}<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px 20px\">\n<div><h6>Palette<\u002Fh6><div style=\"display:flex;gap:4px;margin-top:8px\"><sc-for list=\"{{ sel.dots }}\" as=\"d\" hint-placeholder-count=\"4\"><div style=\"{{ d.s }}\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<div><h6>Typography<\u002Fh6><div style=\"font-size:13px;margin-top:8px\">{{ sel.typeName }}<\u002Fdiv><\u002Fdiv>\n<div><h6>Finish<\u002Fh6><div style=\"font-size:13px;margin-top:8px\">{{ sel.finishRec }}<\u002Fdiv><\u002Fdiv>\n<div><h6>Production<\u002Fh6><div style=\"font-size:13px;margin-top:8px\">{{ sel.complexity }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Preflight<\u002Fh6>\n<div style=\"border-top:1px solid var(--color-divider);margin-top:10px\">\n<sc-for list=\"{{ checks }}\" as=\"k\" hint-placeholder-count=\"6\">\n<div style=\"display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--color-divider)\">\n<span style=\"{{ k.dot }}\"><\u002Fspan>\n<span style=\"font-size:13px;flex:1\">{{ k.label }}<\u002Fspan>\n<span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 52%,transparent)\">{{ k.state }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;margin-top:22px\">\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ goEditor }}\">Customise this<\u002Fbutton>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ noop }}\">Export print files<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isEditor }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 400px;min-height:calc(100vh - 62px)\">\n<div style=\"display:flex;flex-direction:column\">\n<div style=\"padding:20px 44px;border-bottom:1px solid var(--color-divider);display:flex;align-items:center;gap:12px\">\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goDetail }}\">Back to concept<\u002Fbutton>\n<div style=\"display:flex\"><button class=\"cw-tab\" sc-camel-on-click=\"{{ showFront }}\" style=\"{{ sFront }}\">Front<\u002Fbutton><button class=\"cw-tab\" sc-camel-on-click=\"{{ showBack }}\" style=\"{{ sBack }}\">Back<\u002Fbutton><\u002Fdiv>\n<div style=\"margin-left:auto;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">Safe area shown<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:var(--color-surface);padding:40px\">\n<div style=\"position:relative;padding:22px;border:1px dashed color-mix(in srgb,var(--color-text) 30%,transparent)\">\n<dc-import name=\"CardFace\" concept=\"{{ sel.data }}\" scale=\"1\" side=\"{{ side }}\" foil=\"{{ layerFoil }}\" uv=\"{{ layerUv }}\" emboss=\"{{ layerEmboss }}\" hint-size=\"440px,251px\"><\u002Fdc-import>\n<div style=\"position:absolute;left:0;top:-18px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 45%,transparent)\">3 mm bleed<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:2px solid var(--color-divider);padding:18px 44px\">\n<h6 style=\"color:var(--color-accent)\">Make it more…<\u002Fh6>\n<div style=\"display:flex;gap:10px;margin-top:10px;align-items:center\">\n<input class=\"input\" style=\"flex:1\" placeholder=\"Make my name more prominent, tone down the background, keep the palette\">\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ noop }}\">Apply<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap\">\n<sc-for list=\"{{ nlChips }}\" as=\"n\" hint-placeholder-count=\"4\">\n<button class=\"cw-chip\" sc-camel-on-click=\"{{ n.apply }}\">{{ n.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:12px;margin-top:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ nlNote }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-left:2px solid var(--color-divider);padding:24px 24px 60px;overflow:auto\">\n<h6>Content<\u002Fh6>\n<div style=\"display:flex;flex-direction:column;gap:12px;margin-top:12px\">\n<div class=\"field\"><label>Name<\u002Flabel><input class=\"input\" value=\"Mohiuddin Ahmed\"><\u002Fdiv>\n<div class=\"field\"><label>Title<\u002Flabel><input class=\"input\" value=\"Chief Executive Officer\"><\u002Fdiv>\n<div class=\"field\"><label>Company<\u002Flabel><input class=\"input\" value=\"NOVA Technologies\"><\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Regenerate one part<\u002Fh6>\n<p style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 58%,transparent);margin-top:8px\">Everything else stays exactly where it is.<\u002Fp>\n\n<div style=\"border-top:1px solid var(--color-divider);margin-top:12px\">\n<button class=\"cw-railitem\" sc-camel-on-click=\"{{ openType }}\"><span style=\"flex:1;font-size:13px\">Typography<\u002Fspan><span style=\"font-size:11px;color:var(--color-accent)\">{{ typeCount }}<\u002Fspan><\u002Fbutton>\n<sc-if value=\"{{ typeOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:6px;padding:12px 0 14px\">\n<sc-for list=\"{{ typeAlts }}\" as=\"t\" hint-placeholder-count=\"5\">\n<button class=\"cw-chip\" sc-camel-on-click=\"{{ t.apply }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<button class=\"cw-railitem\" sc-camel-on-click=\"{{ openColor }}\"><span style=\"flex:1;font-size:13px\">Colour<\u002Fspan><span style=\"font-size:11px;color:var(--color-accent)\">{{ colorCount }}<\u002Fspan><\u002Fbutton>\n<sc-if value=\"{{ colorOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:6px;padding:12px 0 14px\">\n<sc-for list=\"{{ colorAlts }}\" as=\"p\" hint-placeholder-count=\"5\">\n<button class=\"cw-chip\" sc-camel-on-click=\"{{ p.apply }}\" style=\"display:flex;align-items:center;gap:10px\"><span style=\"{{ p.sw }}\"><\u002Fspan>{{ p.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<button class=\"cw-railitem\" sc-camel-on-click=\"{{ openLayout }}\"><span style=\"flex:1;font-size:13px\">Layout<\u002Fspan><span style=\"font-size:11px;color:var(--color-accent)\">{{ layoutCount }}<\u002Fspan><\u002Fbutton>\n<sc-if value=\"{{ layoutOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:6px;padding:12px 0 14px\">\n<sc-for list=\"{{ layoutAlts }}\" as=\"l\" hint-placeholder-count=\"5\">\n<button class=\"cw-chip\" sc-camel-on-click=\"{{ l.apply }}\" style=\"{{ l.style }}\">{{ l.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<hr class=\"hr\">\n<h6>Fine adjustment<\u002Fh6>\n<div style=\"margin-top:12px\">\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent);margin-bottom:8px\">Density<\u002Fdiv>\n<div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n<sc-for list=\"{{ densityAlts }}\" as=\"d\" hint-placeholder-count=\"3\"><button class=\"cw-chip\" sc-camel-on-click=\"{{ d.apply }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent);margin:18px 0 8px\">Corners<\u002Fdiv>\n<div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n<sc-for list=\"{{ cornerAlts }}\" as=\"c\" hint-placeholder-count=\"3\"><button class=\"cw-chip\" sc-camel-on-click=\"{{ c.apply }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent);margin:18px 0 8px\">Back side<\u002Fdiv>\n<div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n<sc-for list=\"{{ backAlts }}\" as=\"b\" hint-placeholder-count=\"3\"><button class=\"cw-chip\" sc-camel-on-click=\"{{ b.apply }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:14px\">Rounded corners are a die cut, not a style — they add AED 0.30 per card and cannot be combined with edge painting.<\u002Fdiv>\n<\u002Fdiv>\n\n<hr class=\"hr\">\n<h6>Design critic<\u002Fh6>\n<div style=\"border-top:1px solid var(--color-divider);margin-top:10px\">\n<sc-for list=\"{{ critic }}\" as=\"c\" hint-placeholder-count=\"3\">\n<div style=\"padding:12px 0;border-bottom:1px solid var(--color-divider);display:flex;gap:10px\">\n<span style=\"{{ c.dot }}\"><\u002Fspan>\n<span style=\"font-size:12.5px;line-height:1.5;flex:1\">{{ c.text }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<hr class=\"hr\">\n<h6>Finishing<\u002Fh6>\n<div style=\"display:flex;gap:0;margin-top:10px\">\n<button class=\"cw-tab\" sc-camel-on-click=\"{{ toggleFoil }}\" style=\"{{ sFoilBtn }}\">Foil<\u002Fbutton>\n<button class=\"cw-tab\" sc-camel-on-click=\"{{ toggleUv }}\" style=\"{{ sUvBtn }}\">Spot UV<\u002Fbutton>\n<button class=\"cw-tab\" sc-camel-on-click=\"{{ toggleEmboss }}\" style=\"{{ sEmbossBtn }}\">Emboss<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"font-size:12px;margin-top:10px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ costNote }}<\u002Fdiv>\n<div style=\"display:flex;gap:10px;margin-top:22px\">\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ noop }}\">Export<\u002Fbutton>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goResults }}\">Try another concept<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isLayoutBuild }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 400px;min-height:calc(100vh - 62px)\">\n<div style=\"padding:26px 40px 60px\">\n<h6 style=\"color:var(--color-accent)\">Design studio — internal<\u002Fh6>\n<h1 style=\"margin:0\">Layout builder<\u002Fh1>\n<p style=\"margin-top:8px;max-width:560px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">A card system is a grid, a set of named slots and the rules that govern them. Nothing is placed by eye — slots are declared on the grid and every composition fills them.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px\">\n<div class=\"seg\">\n<sc-for list=\"{{ builderViews }}\" as=\"v\" hint-placeholder-count=\"3\">\n<label class=\"seg-opt\" style=\"{{ v.style }}\" sc-camel-on-click=\"{{ v.pick }}\">{{ v.label }}<\u002Flabel>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">12 × 8 grid · 85 × 55 mm · safe area 4 mm<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap\">\n<div>\n<div style=\"{{ canvasStyle }}\">\n<div style=\"{{ canvasGrid }}\"><\u002Fdiv>\n<div style=\"{{ safeBox }}\"><\u002Fdiv>\n<sc-for list=\"{{ slots }}\" as=\"s\" hint-placeholder-count=\"6\">\n<div sc-camel-on-click=\"{{ s.pick }}\" style=\"{{ s.box }}\"><span style=\"{{ s.tag }}\">{{ s.label }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:10px\">Click a slot to inspect its rules. Overlapping slots are rejected at publish.<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h6>Rendered result<\u002Fh6>\n<div style=\"margin-top:12px\"><dc-import name=\"CardFace\" concept=\"{{ sel.data }}\" scale=\"0.62\" side=\"front\" hint-size=\"273px,156px\"><\u002Fdc-import><\u002Fdiv>\n<div style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:10px;max-width:270px\">The same skeleton, filled with a real brief. Any slot the brief cannot fill collapses and the grid reflows.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Slots<\u002Fh6>\n<sc-raw-table class=\"table\" style=\"margin-top:10px\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Slot<\u002Fsc-raw-th><sc-raw-th>Bound field<\u002Fsc-raw-th><sc-raw-th>Position<\u002Fsc-raw-th><sc-raw-th>Minimum<\u002Fsc-raw-th><sc-raw-th>Rule<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{ slots }}\" as=\"s\" hint-placeholder-count=\"6\">\n<sc-raw-tr sc-camel-on-click=\"{{ s.pick }}\" style=\"{{ s.rowStyle }}\"><sc-raw-td style=\"font-weight:600\">{{ s.label }}<\u002Fsc-raw-td><sc-raw-td>{{ s.field }}<\u002Fsc-raw-td><sc-raw-td style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px\">{{ s.pos }}<\u002Fsc-raw-td><sc-raw-td>{{ s.min }}<\u002Fsc-raw-td><sc-raw-td style=\"font-size:12px\">{{ s.rule }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<div style=\"border-left:2px solid var(--color-divider);padding:24px 24px 60px;background:var(--color-surface)\">\n<h6>Selected slot<\u002Fh6>\n<h4 style=\"margin-top:10px\">{{ slot.label }}<\u002Fh4>\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ slot.pos }}<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n<div class=\"field\"><label>Column<\u002Flabel><input class=\"input\" value=\"{{ slot.x }}\"><\u002Fdiv>\n<div class=\"field\"><label>Row<\u002Flabel><input class=\"input\" value=\"{{ slot.y }}\"><\u002Fdiv>\n<div class=\"field\"><label>Width<\u002Flabel><input class=\"input\" value=\"{{ slot.w }}\"><\u002Fdiv>\n<div class=\"field\"><label>Height<\u002Flabel><input class=\"input\" value=\"{{ slot.h }}\"><\u002Fdiv>\n<\u002Fdiv>\n<h6 style=\"margin-top:20px\">Behaviour<\u002Fh6>\n<p style=\"font-size:13px;line-height:1.55;margin-top:8px\">{{ slot.rule }}<\u002Fp>\n<h6 style=\"margin-top:20px\">Overflow<\u002Fh6>\n<div class=\"seg\" style=\"margin-top:10px\"><label class=\"seg-opt\"><input type=\"radio\" name=\"ovf\" sc-camel-default-checked=\"{{ yes }}\">Shrink<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"ovf\">Wrap<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"ovf\">Move to back<\u002Flabel><\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:10px\">Shrink stops at the print minimum. When it does, the composition changes rather than overflowing.<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Permitted variations<\u002Fh6>\n<div style=\"display:flex;gap:7px;flex-wrap:wrap;margin-top:10px\">\n<sc-for list=\"{{ slotVariations }}\" as=\"v\" hint-placeholder-count=\"4\"><span class=\"tag tag-neutral\">{{ v.label }}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;margin-top:22px\">\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ goAdmin }}\">Save system<\u002Fbutton>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goAdmin }}\">Cancel<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isTracking }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 400px;min-height:calc(100vh - 62px)\">\n<div style=\"padding:34px 44px 60px\">\n<div style=\"display:flex;align-items:baseline;gap:14px\">\n<h1 style=\"margin:0\">ORD-2288<\u002Fh1>\n<span class=\"tag tag-accent\">Proof with you<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin-top:8px;max-width:540px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">A single card was printed on the exact stock and finish of the run. Hold it, then approve or send it back with a note. Nothing is charged until you approve.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"border-top:2px solid var(--color-divider)\">\n<sc-for list=\"{{ trackSteps }}\" as=\"t\" hint-placeholder-count=\"6\">\n<div style=\"display:grid;grid-template-columns:16px 1fr 220px 130px;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--color-divider)\">\n<span style=\"{{ t.dot }}\"><\u002Fspan>\n<div>\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;{{ t.dim }}\">{{ t.title }}<\u002Fdiv>\n<div style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 58%,transparent);margin-top:3px\">{{ t.note }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ t.who }}<\u002Fdiv>\n<div style=\"font-size:12.5px\">{{ t.when }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Proof feedback<\u002Fh6>\n<textarea class=\"input\" style=\"max-width:620px;min-height:90px;margin-top:10px\" placeholder=\"Anything wrong with the proof — colour, foil registration, trim, stock weight\"><\u002Ftextarea>\n<div style=\"display:flex;gap:10px;margin-top:16px\">\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ noop }}\">Approve and print 1 000<\u002Fbutton>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ noop }}\">Request a second proof<\u002Fbutton>\n<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goEditor }}\">Change the design<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-left:2px solid var(--color-divider);padding:26px 26px 60px;background:var(--color-surface)\">\n<h6>Order<\u002Fh6>\n<div style=\"margin-top:14px\"><dc-import name=\"CardFace\" concept=\"{{ sel.data }}\" scale=\"0.62\" side=\"front\" foil=\"{{ layerFoil }}\" hint-size=\"273px,156px\"><\u002Fdc-import><\u002Fdiv>\n<sc-raw-table class=\"table\" style=\"margin-top:16px\">\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"width:48%\">Design<\u002Fsc-raw-td><sc-raw-td>{{ sel.name }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Quantity<\u002Fsc-raw-td><sc-raw-td>1 000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Stock<\u002Fsc-raw-td><sc-raw-td>450 gsm cotton<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Finish<\u002Fsc-raw-td><sc-raw-td>Soft-touch, gold foil<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Press<\u002Fsc-raw-td><sc-raw-td>Gulf Press, Sharjah<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Total<\u002Fsc-raw-td><sc-raw-td>AED 1 845<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<hr class=\"hr\">\n<h6>Delivery<\u002Fh6>\n<div style=\"font-size:13px;line-height:1.6;margin-top:8px\">Mohiuddin Ahmed<br>NOVA Technologies<br>Building 12, Dubai Internet City<br>+971 50 214 8890<\u002Fdiv>\n<button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ goDashboard }}\">All orders<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isNoResults }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:60px 44px\">\n<h6 style=\"color:var(--color-accent)\">Step 08<\u002Fh6>\n<h1 style=\"margin:0;max-width:700px\">Two of your answers cannot both be true.<\u002Fh1>\n<p style=\"margin-top:10px;max-width:560px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Rather than return six compromised cards, here is the conflict. Relax one constraint and generation runs again immediately.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,420px));gap:0;border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)\">\n<div style=\"padding:22px 24px 22px 0;border-right:1px solid var(--color-divider)\">\n<h6 style=\"color:var(--color-accent)\">Constraint A<\u002Fh6>\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;margin-top:8px\">Letterpress and edge painting<\u002Fdiv>\n<p style=\"font-size:13px;margin-top:8px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Selected in step 06. Both need 600 gsm uncoated cotton and a die, and both are applied by hand.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding:22px 0 22px 24px\">\n<h6 style=\"color:var(--color-accent)\">Constraint B<\u002Fh6>\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:19px;margin-top:8px\">Standard budget, 100 cards<\u002Fdiv>\n<p style=\"font-size:13px;margin-top:8px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Selected in step 07. The die alone is AED 340 before a single card is printed, which is more than the whole budget.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<h6 style=\"margin-top:30px\">Choose one<\u002Fh6>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,300px));gap:0;border-top:1px solid var(--color-divider);margin-top:10px\">\n<sc-for list=\"{{ resolutions }}\" as=\"r\" hint-placeholder-count=\"3\">\n<div style=\"{{ r.cell }}\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:15px\">{{ r.title }}<\u002Fdiv>\n<p style=\"font-size:12.5px;margin-top:6px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">{{ r.note }}<\u002Fp>\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ r.apply }}\">{{ r.cta }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:24px;max-width:560px\">Nothing else in your brief changes. This is the only conflict the engine found — everything else composed cleanly.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 360px;min-height:calc(100vh - 62px)\">\n<div style=\"padding:34px 44px 60px\">\n<h1 style=\"mar
