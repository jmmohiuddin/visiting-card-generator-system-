gin:0\">Settings<\u002Fh1>\n<p style=\"margin-top:8px;max-width:520px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Defaults applied to every new brief. Each one can still be changed inside a brief.<\u002Fp>\n<hr class=\"hr\">\n<h6>Account<\u002Fh6>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;max-width:620px;margin-top:12px\">\n<div class=\"field\"><label>Name<\u002Flabel><input class=\"input\" value=\"Mohiuddin Ahmed\"><\u002Fdiv>\n<div class=\"field\"><label>Email<\u002Flabel><input class=\"input\" value=\"m.ahmed@novatech.ae\"><\u002Fdiv>\n<div class=\"field\"><label>Plan<\u002Flabel><input class=\"input\" value=\"Premium — AED 89 / month\"><\u002Fdiv>\n<div class=\"field\"><label>Default brand profile<\u002Flabel><input class=\"input\" value=\"NOVA Technologies\"><\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Defaults<\u002Fh6>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px;max-width:620px;margin-top:14px\">\n<div>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent);margin-bottom:8px\">Print market<\u002Fdiv>\n<div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"setmarket\" sc-camel-default-checked=\"{{ yes }}\">UAE<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"setmarket\">India<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"setmarket\">US<\u002Flabel><\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent);margin:20px 0 8px\">Units<\u002Fdiv>\n<div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"units\" sc-camel-default-checked=\"{{ yes }}\">Millimetres<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"units\">Inches<\u002Flabel><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent);margin-bottom:8px\">Concepts per generation<\u002Fdiv>\n<div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"cpg\">4<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"cpg\" sc-camel-default-checked=\"{{ yes }}\">6<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"cpg\">10<\u002Flabel><\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent);margin:20px 0 8px\">Budget ceiling<\u002Fdiv>\n<div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"setbudget\">Standard<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"setbudget\" sc-camel-default-checked=\"{{ yes }}\">Premium<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"setbudget\">Luxury<\u002Flabel><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Notifications<\u002Fh6>\n<div style=\"display:flex;flex-direction:column;gap:11px;margin-top:12px;max-width:520px\">\n<sc-for list=\"{{ notifs }}\" as=\"n\" hint-placeholder-count=\"4\">\n<label class=\"radio\" style=\"display:flex;width:100%\"><input type=\"checkbox\" sc-camel-default-checked=\"{{ n.on }}\"><span style=\"{{ n.box }}\"><\u002Fspan><span style=\"flex:1\">{{ n.label }}<\u002Fspan><\u002Flabel>\n<\u002Fsc-for>\n<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"display:flex;gap:10px\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ noop }}\">Save<\u002Fbutton><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ noop }}\">Delete account<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-left:2px solid var(--color-divider);padding:26px;background:var(--color-surface)\">\n<h6>Data<\u002Fh6>\n<sc-raw-table class=\"table\" style=\"margin-top:12px\">\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"width:56%\">Drafts kept<\u002Fsc-raw-td><sc-raw-td>24 months<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Logos stored<\u002Fsc-raw-td><sc-raw-td>5 files<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Print files<\u002Fsc-raw-td><sc-raw-td>Signed links, 7 days<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Contact data shared<\u002Fsc-raw-td><sc-raw-td>Press only, per order<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 58%,transparent);margin-top:14px\">Your contact details are never sent to a model provider. The sentence you write on the start screen is; nothing from the contact step is.<\u002Fdiv>\n<button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ noop }}\">Export my data<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSignin }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 62px)\">\n<div style=\"padding:70px 44px\">\n<h6 style=\"color:var(--color-accent)\">Account<\u002Fh6>\n<h1 style=\"margin-bottom:12px\">Sign in<\u002Fh1>\n<p style=\"max-width:400px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Your brand profiles, drafts and print orders live here. Generating a first concept does not need an account.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:flex;flex-direction:column;gap:16px;max-width:400px\">\n<div class=\"field\"><label>Email<\u002Flabel><input class=\"input\" value=\"m.ahmed@novatech.ae\"><\u002Fdiv>\n<div class=\"field\"><label>Password<\u002Flabel><input class=\"input\" type=\"password\" value=\"............\"><\u002Fdiv>\n<button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ goDashboard }}\">Sign in<\u002Fbutton>\n<button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ goDashboard }}\">Continue with Google<\u002Fbutton>\n<div style=\"display:flex;gap:16px;font-size:12.5px;margin-top:4px\"><a href=\"#\" sc-camel-on-click=\"{{ noop }}\">Forgot password<\u002Fa><a href=\"#\" sc-camel-on-click=\"{{ goStart }}\">Create an account<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:var(--color-accent);color:var(--color-bg);padding:70px 50px;display:flex;flex-direction:column;justify-content:space-between\">\n<h2 style=\"font-size:52px;line-height:1.02;max-width:520px;margin:0\">Don't make the user learn design. Build a system that understands it.<\u002Fh2>\n<div style=\"font-size:13px;opacity:.9;max-width:420px\">Three thousand eight hundred components, composed against your brief — not an image model guessing at typography.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPricing }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:34px 44px 60px\">\n<h1 style=\"margin:0\">Plans<\u002Fh1>\n<p style=\"margin-top:8px;max-width:560px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Generating is free because the cost sits in printing. Paid plans buy unrestricted output, premium finishes and brand management.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)\">\n<sc-for list=\"{{ plans }}\" as=\"p\" hint-placeholder-count=\"4\">\n<div style=\"{{ p.cell }}\">\n<h6 style=\"{{ p.kicker }}\">{{ p.name }}<\u002Fh6>\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:34px;margin-top:10px\">{{ p.price }}<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ p.per }}<\u002Fdiv>\n<p style=\"font-size:13px;margin-top:14px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">{{ p.who }}<\u002Fp>\n<div style=\"margin-top:auto\"><button class=\"{{ p.btnClass }}\" sc-camel-on-click=\"{{ noop }}\">{{ p.cta }}<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<h6 style=\"margin-top:34px\">What is included<\u002Fh6>\n<sc-raw-table class=\"table\" style=\"margin-top:12px\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Capability<\u002Fsc-raw-th><sc-raw-th>Free<\u002Fsc-raw-th><sc-raw-th>Pro<\u002Fsc-raw-th><sc-raw-th>Premium<\u002Fsc-raw-th><sc-raw-th>Business<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{ planRows }}\" as=\"r\" hint-placeholder-count=\"9\">\n<sc-raw-tr><sc-raw-td>{{ r.label }}<\u002Fsc-raw-td><sc-raw-td>{{ r.free }}<\u002Fsc-raw-td><sc-raw-td>{{ r.pro }}<\u002Fsc-raw-td><sc-raw-td>{{ r.premium }}<\u002Fsc-raw-td><sc-raw-td>{{ r.business }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:14px;max-width:620px\">Printing is billed per order at press cost plus margin, on every plan. Foil plates and letterpress dies are one-off charges that carry over to repeat runs.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isProfiles }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 380px;min-height:calc(100vh - 62px)\">\n<div style=\"padding:34px 44px 60px\">\n<div style=\"display:flex;align-items:flex-end;gap:20px\">\n<div style=\"margin-right:auto\">\n<h1 style=\"margin:0\">Brand profiles<\u002Fh1>\n<p style=\"margin-top:8px;max-width:520px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">One person, several identities. Each profile keeps its own logo, palette, contact set and card history, so a board card never inherits the freelance palette.<\u002Fp>\n<\u002Fdiv>\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ noop }}\">New profile<\u002Fbutton>\n<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"border-top:2px solid var(--color-divider)\">\n<sc-for list=\"{{ profileRows }}\" as=\"p\" hint-placeholder-count=\"4\">\n<div sc-camel-on-click=\"{{ p.pick }}\" style=\"{{ p.row }}\">\n<div style=\"{{ p.mark }}\">{{ p.initial }}<\u002Fdiv>\n<div style=\"flex:1\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:17px\">{{ p.name }}<\u002Fdiv>\n<div style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 58%,transparent);margin-top:3px\">{{ p.role }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:4px\"><sc-for list=\"{{ p.dots }}\" as=\"d\" hint-placeholder-count=\"3\"><span style=\"{{ d.s }}\"><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n<div style=\"width:130px;font-size:12.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ p.cards }}<\u002Fdiv>\n<div style=\"width:110px;font-size:12.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ p.updated }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Saved logos<\u002Fh6>\n<div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:16px;max-width:660px;margin-top:14px\">\n<sc-for list=\"{{ logos }}\" as=\"l\" hint-placeholder-count=\"5\">\n<div><div style=\"{{ l.box }}\">{{ l.initial }}<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;margin-top:6px\">{{ l.file }}<\u002Fdiv><div style=\"font-size:10.5px;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">{{ l.note }}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-left:2px solid var(--color-divider);padding:26px 26px 60px;background:var(--color-surface)\">\n<h6>Selected profile<\u002Fh6>\n<h3 style=\"margin-top:10px\">{{ profile.name }}<\u002Fh3>\n<div style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">{{ profile.role }}<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Palette<\u002Fh6>\n<div style=\"display:flex;gap:6px;margin-top:10px\"><sc-for list=\"{{ profile.dots }}\" as=\"d\" hint-placeholder-count=\"3\"><span style=\"{{ d.big }}\"><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n<h6 style=\"margin-top:22px\">Contact set<\u002Fh6>\n<sc-raw-table class=\"table\" style=\"margin-top:10px\">\n<sc-raw-tbody>\n<sc-for list=\"{{ profile.contacts }}\" as=\"c\" hint-placeholder-count=\"4\">\n<sc-raw-tr><sc-raw-td style=\"width:38%\">{{ c.k }}<\u002Fsc-raw-td><sc-raw-td>{{ c.v }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<div style=\"display:flex;gap:10px;margin-top:20px\">\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ goIntake }}\">New card from this<\u002Fbutton>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ noop }}\">Edit<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isMockups }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:34px 44px 60px\">\n<div style=\"display:flex;align-items:flex-end;gap:20px\">\n<div style=\"margin-right:auto\">\n<h1 style=\"margin:0\">Mockups<\u002Fh1>\n<p style=\"margin-top:8px;max-width:560px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">For sending to colleagues before anything is printed. These approximate the finish under one lighting setup; they are not a proof.<\u002Fp>\n<\u002Fdiv>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goExport }}\">Back to export<\u002Fbutton>\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ noop }}\">Download all<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;margin-top:18px;flex-wrap:wrap\">\n<sc-for list=\"{{ scenes }}\" as=\"s\" hint-placeholder-count=\"5\">\n<button class=\"cw-chip\" sc-camel-on-click=\"{{ s.pick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:2fr 1fr 1fr;gap:20px\">\n<div>\n<div style=\"{{ heroMock }}\">Photograph placeholder — {{ sceneLabel }}<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:8px\">{{ sceneNote }}<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ mockGrid }}\" as=\"m\" hint-placeholder-count=\"4\">\n<div><div style=\"{{ m.box }}\">Placeholder<\u002Fdiv><div style=\"font-size:11.5px;margin-top:6px\">{{ m.label }}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"display:flex;gap:10px;align-items:flex-start;border-left:3px solid var(--color-accent);padding-left:14px;max-width:640px\">\n<div style=\"font-size:13px\">Soft-touch laminate photographs darker than it looks in the hand, and foil only catches light at an angle. If the finish matters to the decision, order the proof.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isCompEdit }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 380px;min-height:calc(100vh - 62px)\">\n<div style=\"padding:30px 40px 60px\">\n<h6 style=\"color:var(--color-accent)\">Design studio — internal<\u002Fh6>\n<h1 style=\"margin:0\">New component<\u002Fh1>\n<p style=\"margin-top:8px;max-width:540px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Metadata is the product. A component with weak tags gets composed into the wrong cards, and the generator has no way to notice.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;max-width:640px\">\n<div class=\"field\"><label>Name<\u002Flabel><input class=\"input\" value=\"Edge-painted stock\"><\u002Fdiv>\n<div class=\"field\"><label>Slug<\u002Flabel><input class=\"input\" value=\"fin.stock.edge-paint\"><\u002Fdiv>\n<div class=\"field\"><label>Category<\u002Flabel><input class=\"input\" value=\"Finishing systems\"><\u002Fdiv>\n<div class=\"field\"><label>Version<\u002Flabel><input class=\"input\" value=\"1.2\"><\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Tags<\u002Fh6>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px;max-width:640px;margin-top:14px\">\n<div>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent);margin-bottom:8px\">Personality<\u002Fdiv>\n<div style=\"display:flex;gap:7px;flex-wrap:wrap\"><sc-for list=\"{{ tagPersonality }}\" as=\"t\" hint-placeholder-count=\"6\"><button class=\"cw-chip\" sc-camel-on-click=\"{{ t.toggle }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 60%,transparent);margin-bottom:8px\">Industry<\u002Fdiv>\n<div style=\"display:flex;gap:7px;flex-wrap:wrap\"><sc-for list=\"{{ tagIndustry }}\" as=\"t\" hint-placeholder-count=\"6\"><button class=\"cw-chip\" sc-camel-on-click=\"{{ t.toggle }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Compatibility<\u002Fh6>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px;max-width:640px;margin-top:14px\">\n<div class=\"field\"><label>Requires<\u002Flabel><input class=\"input\" value=\"600 gsm cotton, uncoated\"><\u002Fdiv>\n<div class=\"field\"><label>Never combine with<\u002Flabel><input class=\"input\" value=\"Lamination, standard stocks\"><\u002Fdiv>\n<div class=\"field\"><label>Orientation<\u002Flabel><input class=\"input\" value=\"Landscape, portrait, square\"><\u002Fdiv>\n<div class=\"field\"><label>Minimum trim width<\u002Flabel><input class=\"input\" value=\"74 mm\"><\u002Fdiv>\n<div class=\"field\"><label>Price level<\u002Flabel><input class=\"input\" value=\"Luxury\"><\u002Fdiv>\n<div class=\"field\"><label>Print complexity<\u002Flabel><input class=\"input\" value=\"High — hand-applied\"><\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"display:flex;gap:10px\">\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ goAdmin }}\">Publish v1.2<\u002Fbutton>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goAdmin }}\">Save as draft<\u002Fbutton>\n<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goAdmin }}\">Discard<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-left:2px solid var(--color-divider);padding:26px 26px 60px;background:var(--color-surface)\">\n<h6>Preview<\u002Fh6>\n<div style=\"margin-top:12px;background:var(--color-bg);border:1px solid var(--color-divider);height:170px;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 42%,transparent)\">Component asset<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Conflicts detected<\u002Fh6>\n<div style=\"border-top:1px solid var(--color-divider);margin-top:10px\">\n<sc-for list=\"{{ conflicts }}\" as=\"c\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--color-divider)\">\n<span style=\"{{ c.dot }}\"><\u002Fspan><span style=\"font-size:12.5px;line-height:1.5;flex:1\">{{ c.text }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:14px\">Publishing runs the component through 40 sample briefs and reports any card it would break.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isStart }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 420px;min-height:calc(100vh - 62px)\">\n<div style=\"padding:60px 44px\">\n<h6 style=\"color:var(--color-accent)\">Before the brief<\u002Fh6>\n<h1 style=\"font-size:56px;max-width:760px;margin-bottom:14px;text-wrap:pretty\">Describe yourself in one sentence.<\u002Fh1>\n<p style=\"max-width:520px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">We turn it into a starting brief. Every answer it fills in is visible on the right and editable in the next twelve steps — nothing is decided behind your back.<\u002Fp>\n<hr class=\"hr\">\n<textarea class=\"input\" style=\"max-width:680px;min-height:120px;font-size:17px;line-height:1.45\">I run a premium technology company in Dubai and I meet investors and enterprise clients.<\u002Ftextarea>\n<div style=\"display:flex;gap:8px;margin-top:14px;flex-wrap:wrap\">\n<sc-for list=\"{{ startExamples }}\" as=\"e\" hint-placeholder-count=\"4\">\n<button class=\"cw-chip\" sc-camel-on-click=\"{{ e.pick }}\" style=\"{{ e.style }}\">{{ e.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;margin-top:26px;align-items:center\">\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ goIntake }}\">Continue to the brief<\u002Fbutton>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goLibrary }}\">Browse the library instead<\u002Fbutton>\n<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);max-width:560px\">Nothing here is generated by an image model. The sentence only selects components; the typography, spacing and print geometry are computed.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-left:2px solid var(--color-divider);padding:26px;background:var(--color-surface)\">\n<h6>What we read from it<\u002Fh6>\n<div style=\"border-top:1px solid var(--color-divider);margin-top:12px\">\n<sc-for list=\"{{ inferred }}\" as=\"i\" hint-placeholder-count=\"6\">\n<div style=\"display:flex;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--color-divider)\">\n<span style=\"font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 50%,transparent);width:96px;flex:none\">{{ i.k }}<\u002Fspan>\n<span style=\"font-size:13.5px;flex:1\">{{ i.v }}<\u002Fspan>\n<span style=\"{{ i.confStyle }}\">{{ i.conf }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:16px\">Low confidence items are asked about explicitly rather than guessed.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isLibrary }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 62px)\">\n<div class=\"cw-rail\">\n<div style=\"padding:18px 20px;border-bottom:2px solid var(--color-divider)\">\n<h6 style=\"margin:0\">Filter<\u002Fh6>\n<\u002Fdiv>\n<sc-for list=\"{{ libFilters }}\" as=\"f\" hint-placeholder-count=\"8\">\n<button class=\"cw-railitem\" sc-camel-on-click=\"{{ f.pick }}\" style=\"{{ f.style }}\"><span style=\"flex:1\">{{ f.label }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">{{ f.count }}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"padding:30px 40px 60px\">\n<div style=\"display:flex;align-items:flex-end;gap:20px\">\n<div style=\"margin-right:auto\">\n<h1 style=\"margin:0\">Template library<\u002Fh1>\n<p style=\"margin-top:8px;max-width:540px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">Complete cards assembled from the same components the engine uses. Pick one as a starting point and your details drop straight in.<\u002Fp>\n<\u002Fdiv>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goStart }}\">Generate instead<\u002Fbutton>\n<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--color-divider)\">\n<sc-for list=\"{{ templates }}\" as=\"t\" hint-placeholder-count=\"6\">\n<div class=\"cw-tile\" sc-camel-on-click=\"{{ t.open }}\" style=\"{{ t.tileStyle }}\">\n<dc-import name=\"CardFace\" concept=\"{{ t.data }}\" scale=\"0.62\" side=\"front\" hint-size=\"273px,156px\"><\u002Fdc-import>\n<div style=\"display:flex;align-items:baseline;gap:10px;margin-top:14px\">\n<span class=\"cw-tilehd\" style=\"font-family:var(--font-heading);font-weight:800;font-size:16px\">{{ t.name }}<\u002Fspan>\n<span style=\"font-size:11px;color:color-mix(in srgb,var(--color-text) 50%,transparent);margin-left:auto\">{{ t.price }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 58%,transparent);margin-top:6px\">{{ t.industries }}<\u002Fdiv>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:10px\"><span class=\"tag tag-neutral\">{{ t.typeName }}<\u002Fspan><span class=\"tag tag-neutral\">{{ t.finishShort }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isOrder }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:1fr 400px;min-height:calc(100vh - 62px)\">\n<div style=\"padding:34px 44px 60px\">\n<h6 style=\"color:var(--color-accent)\">Order<\u002Fh6>\n<h1 style=\"margin:0\">Checkout<\u002Fh1>\n<p style=\"margin-top:8px;max-width:540px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">A printed proof is made first. The run only starts once you have held it and approved it.<\u002Fp>\n<hr class=\"hr\">\n<div style=\"display:flex;border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)\">\n<sc-for list=\"{{ orderSteps }}\" as=\"o\" hint-placeholder-count=\"4\">\n<div style=\"{{ o.cell }}\">\n<div style=\"display:flex;gap:8px;align-items:center\"><span style=\"{{ o.dot }}\"><\u002Fspan><span class=\"cw-num\">{{ o.num }}<\u002Fspan><\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;margin-top:8px\">{{ o.title }}<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 58%,transparent);margin-top:4px\">{{ o.note }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<h6 style=\"margin-top:30px\">Delivery<\u002Fh6>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;max-width:620px;margin-top:12px\">\n<div class=\"field\"><label>Recipient<\u002Flabel><input class=\"input\" value=\"Mohiuddin Ahmed\"><\u002Fdiv>\n<div class=\"field\"><label>Company<\u002Flabel><input class=\"input\" value=\"NOVA Technologies\"><\u002Fdiv>\n<div class=\"field\" style=\"grid-column:span 2\"><label>Address<\u002Flabel><input class=\"input\" value=\"Building 12, Dubai Internet City, Dubai\"><\u002Fdiv>\n<div class=\"field\"><label>Phone<\u002Flabel><input class=\"input\" value=\"+971 50 214 8890\"><\u002Fdiv>\n<div class=\"field\"><label>Delivery<\u002Flabel><input class=\"input\" value=\"Courier — 4 working days\"><\u002Fdiv>\n<\u002Fdiv>\n<hr class=\"hr\">\n<h6>Press<\u002Fh6>\n<sc-raw-table class=\"table\" style=\"max-width:620px;margin-top:10px\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Partner<\u002Fsc-raw-th><sc-raw-th>Can produce<\u002Fsc-raw-th><sc-raw-th>Lead time<\u002Fsc-raw-th><sc-raw-th>Unit<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{ presses }}\" as=\"p\" hint-placeholder-count=\"3\">\n<sc-raw-tr><sc-raw-td>{{ p.name }}<\u002Fsc-raw-td><sc-raw-td style=\"font-size:12.5px\">{{ p.can }}<\u002Fsc-raw-td><sc-raw-td>{{ p.lead }}<\u002Fsc-raw-td><sc-raw-td>{{ p.unit }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<div style=\"border-left:2px solid var(--color-divider);padding:26px 26px 60px;background:var(--color-surface)\">\n<h6>Summary<\u002Fh6>\n<div style=\"margin-top:14px\"><dc-import name=\"CardFace\" concept=\"{{ sel.data }}\" scale=\"0.62\" side=\"front\" foil=\"{{ layerFoil }}\" hint-size=\"273px,156px\"><\u002Fdc-import><\u002Fdiv>\n<h4 style=\"margin-top:14px\">{{ sel.name }}<\u002Fh4>\n<div style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">{{ qtyLabel }} cards · 450 gsm cotton · soft-touch · gold foil<\u002Fdiv>\n<hr class=\"hr\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n<span style=\"font-family:var(--font-heading);font-weight:800;font-size:15px\">Total<\u002Fspan>\n<span style=\"font-family:var(--font-heading);font-weight:800;font-size:24px\">{{ priceTotal }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:6px\">Charged after proof approval.<\u002Fdiv>\n<button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ goTracking }}\">Request a printed proof<\u002Fbutton>\n<button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ goExport }}\">Back to files<\u00 ass=\"btn btn-secondary\" sc-camel-on-click=\"{{ noop }}\">Unpublish<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nconst CONCEPTS = [\n  { id: 'c1', num: '01', name: 'Executive Minimal', layout: 'rule', bg: '#ffffff', fg: '#16161a', accent: '#ec3013', muted: '#8a8785', hair: '#d8d5d2', font: \"'Space Grotesk', sans-serif\", back: 'contact',\n    blurb: 'Ink on white, one rule, nothing else. The name is the only thing that carries weight.', typeName: 'Geometric sans', finishRec: 'Matte lamination', finishShort: 'Matte', complexity: 'Low complexity', fit: 91,\n    why: 'You asked for modern and powerful. Restraint reads as seniority, so the card holds one accent mark and a single hierarchy step from name to title. Nothing competes, which is why it survives being printed small and cheap.' },\n  { id: 'c2', num: '02', name: 'Luxury Signature', layout: 'centered', bg: '#0d0d0c', fg: '#efe9dc', accent: '#c9a227', muted: '#8e8778', hair: '#6f6a5c', font: \"'Playfair Display', serif\", back: 'mark',\n    blurb: 'A dark field, a centred monogram, and gold reserved for two elements only.', typeName: 'Luxury serif', finishRec: 'Soft-touch + gold foil', finishShort: 'Gold foil', complexity: 'High complexity', fit: 96,\n    why: 'Premium plus powerful pushes towards contrast and scarcity: a dark ground makes the foil the only bright thing on the card. Gold is limited to the monogram and the company line so the foil layer stays cheap to plate and unmistakable in the hand.' },\n  { id: 'c3', num: '03', name: 'Modern Corporate', layout: 'split', bg: '#ffffff', fg: '#16202b', accent: '#0f3c66', muted: '#7a8794', hair: '#dfe3e7', panel: '#0f3c66', font: \"'Space Grotesk', sans-serif\", back: 'contact',\n    blurb: 'A structured split — brand block on the left, information on the right.', typeName: 'Corporate sans', finishRec: 'Matte lamination', finishShort: 'Matte', complexity: 'Low complexity', fit: 88,\n    why: 'Technology buyers scan cards for a contact route, not for a mood. The split gives the logo a permanent home and lets four contact lines sit in a readable column without crowding the name.' },\n  { id: 'c4', num: '04', name: 'Creative Identity', layout: 'bleed', bg: '#e2402b', fg: '#fff6f2', accent: '#1c1a19', muted: 'rgba(255,246,242,.72)', hair: 'rgba(255,255,255,.4)', font: \"'Archivo', sans-serif\", back: 'qr',\n    blurb: 'Full-bleed colour, oversized name, a ghosted mark running off the edge.', typeName: 'Grotesk display', finishRec: 'Spot UV on the mark', finishShort: 'Spot UV', complexity: 'Medium complexity', fit: 79,\n    why: 'The riskiest of the six, kept in because a founder card sometimes has to be remembered rather than filed. A full ink coverage costs more and shows fingerprints, so the recommendation is a matte laminate with spot UV only where the mark bleeds off.' },\n  { id: 'c5', num: '05', name: 'Premium Editorial', layout: 'editorial', bg: '#f1ece1', fg: '#211f1c', accent: '#7a2e1e', muted: '#8b8377', hair: '#cdc5b6', font: \"'DM Serif Display', serif\", back: 'contact',\n    blurb: 'Warm stock, a book-weight serif, and a great deal of air around the name.', typeName: 'Editorial serif', finishRec: 'Uncoated cotton, letterpress', finishShort: 'Letterpress', complexity: 'High complexity', fit: 85,\n    why: 'Whitespace is the cheapest way to signal expense. Printed letterpress on uncoated cotton the type sits below the surface, which is felt before it is read — the reason this concept skips lamination entirely.' },\n  { id: 'c6', num: '06', name: 'Systems Mono', layout: 'grid', bg: '#1b1e21', fg: '#e6e8ea', accent: '#00e0a4', muted: '#8b959c', hair: '#3a4045', font: \"'IBM Plex Mono', monospace\", back: 'qr',\n    blurb: 'A visible grid, monospaced type, one signal-green accent.', typeName: 'Technical mono', finishRec: 'Soft-touch, no foil', finishShort: 'Soft-touch', complexity: 'Medium complexity', fit: 83,\n    why: 'Reads as engineering rather than marketing, which suits a technical founder talking to technical buyers. The accent is held to two small elements so the card never tips into novelty.' }\n];\nconst VIBES = ['Premium','Luxury','Modern','Minimal','Corporate','Professional','Friendly','Creative','Bold','Powerful','Elegant','Traditional','Futuristic','Trustworthy','Exclusive','Artistic','Sustainable','Sophisticated'];\nconst FINISHES = ['Matte lamination','Soft-touch','Spot UV','Raised spot UV','Gold foil','Embossing','Letterpress','Rounded corners'];\nconst RAIL = [['01','About you'],['02','Contact details'],['03','Brand and logo'],['04','Personality'],['05','Visual direction'],['06','Physical feel'],['07','Print market'],['08','Generate'],['09','Explore'],['10','Customise'],['11','Validate'],['12','Export or order']];\nconst PIPELINE = [\n  ['Reading the brief','7 signals'],['Matching industry systems','1 480 components'],['Filtering by personality','412 remain'],\n  ['Checking finish compatibility','268 remain'],['Composing layouts','96 candidates'],['Scoring hierarchy and print safety','ranked'],['Enforcing diversity','6 selected']\n];\nconst TYPE_ALTS = [\n  ['Geometric sans', \"'Space Grotesk', sans-serif\"], ['Luxury serif', \"'Playfair Display', serif\"],\n  ['Editorial serif', \"'DM Serif Display', serif\"], ['Grotesk display', \"'Archivo', sans-serif\"], ['Technical mono', \"'IBM Plex Mono', monospace\"]\n];\nconst COLOR_ALTS = [\n  ['Black and gold', { bg: '#0d0d0c', fg: '#efe9dc', accent: '#c9a227', muted: '#8e8778', hair: '#6f6a5c', panel: '#0d0d0c' }],\n  ['Ink on white', { bg: '#ffffff', fg: '#16161a', accent: '#ec3013', muted: '#8a8785', hair: '#d8d5d2', panel: '#16161a' }],\n  ['Navy and bone', { bg: '#0f2233', fg: '#eef1f4', accent: '#9fb6c9', muted: '#8494a3', hair: '#2b3d4d', panel: '#0f2233' }],\n  ['Cream and oxblood', { bg: '#f1ece1', fg: '#211f1c', accent: '#7a2e1e', muted: '#8b8377', hair: '#cdc5b6', panel: '#7a2e1e' }],\n  ['Charcoal and signal', { bg: '#1b1e21', fg: '#e6e8ea', accent: '#00e0a4', muted: '#8b959c', hair: '#3a4045', panel: '#1b1e21' }],\n  ['Bone and forest', { bg: '#f5f4ef', fg: '#1a2420', accent: '#2f6f5b', muted: '#828a85', hair: '#cfd3cc', panel: '#2f6f5b' }],\n  ['White and vermilion', { bg: '#ffffff', fg: '#191919', accent: '#ff5a1f', muted: '#7d7d7d', hair: '#e2e2e2', panel: '#191919' }],\n  ['Slate and brass', { bg: '#14213d', fg: '#f2f4f8', accent: '#c8a45c', muted: '#8892a6', hair: '#2a3350', panel: '#14213d' }]\n];\nconst INSTR = {\n  minimal: { label: 'Make them more minimal', note: 'Layouts reduced to a rule, a stack or a frame. Palettes stripped to two colours and the backs simplified to a mark.' },\n  portrait: { label: 'Rotate to portrait', note: 'Trim rotated to 55 × 85 mm. Three layouts cannot hold a tall format and were swapped for ruled stacks — the rest re-composed as they are.' },\n  bold: { label: 'Bolder, larger name', note: 'Display weights, full-bleed and corner compositions, tighter density. The name is now the first and only read.' },\n  dark: { label: 'Darker palettes', note: 'Dark grounds throughout with one bright accent each. Ink coverage rises, so matte lamination is now recommended over uncoated.' },\n  colour: { label: 'More colour', note: 'Accents promoted from marks to fields and panels. Two concepts changed layout to carry the colour properly.' },\n  quiet: { label: 'Less on the front', note: 'Contact routes moved to the back or behind the QR code. Fronts carry the name, the role and one route.' }\n};\nconst PORTRAIT_SAFE = { rule: 1, centered: 1, stack: 1, frame: 1, editorial: 1, corner: 1, bleed: 1, grid: 1, band: 1 };\nconst SLOTS = [\n  { id: 'mark', label: 'Mark', x: 0, y: 0, w: 2, h: 2, field: 'Logo symbol', min: '14 mm', rule: 'Optional — omitted when no logo is uploaded' },\n  { id: 'company', label: 'Company', x: 3, y: 0, w: 6, h: 1, field: 'Company name', min: '8 pt', rule: 'Falls back to the mark slot when the name is longer than 24 characters' },\n  { id: 'name', label: 'Name', x: 0, y: 4, w: 7, h: 2, field: 'Full name', min: '14 pt', rule: 'Type scale fits the real string; two lines permitted before the size drops' },\n  { id: 'role', label: 'Role', x: 0, y: 6, w: 5, h: 1, field: 'Job title', min: '7 pt', rule: 'Always one step below the name in the scale' },\n  { id: 'contact', label: 'Contact', x: 8, y: 4, w: 4, h: 3, field: 'Phone, email, web', min: '6.5 pt', rule: 'Holds two routes at balanced density, four at informative' },\n  { id: 'qr', label: 'QR', x: 10, y: 0, w: 2, h: 2, field: 'QR code', min: '12 mm', rule: 'Front placement only when the back is a mark-only design' }\n];\nconst ADMIN_COMPONENTS = [\n  { name: 'Luxury serif header', slug: 'typ.header.luxury-serif', version: '2.3', next: '2.4', personality: 'Luxury · Premium · Elegant', industries: 'Fashion, real estate, finance', price: 'Premium', status: 'Published',\n    compatible: ['Dark grounds', 'Metallic accents', 'Centred layouts', 'Foil', 'Letterpress'], incompatible: ['Playful palettes', 'Mono contact blocks', 'Full-bleed colour'] },\n  { name: 'Rule and name', slug: 'lay.front.rule-name', version: '4.1', next: '4.2', personality: 'Minimal · Modern · Corporate', industries: 'All', price: 'Basic', status: 'Published',\n    compatible: ['Any palette', 'Sans systems', 'Matte finishes'], incompatible: ['Ghost wordmarks'] },\n  { name: 'Split brand panel', slug: 'lay.front.split-panel', version: '3.0', next: '3.1', personality: 'Corporate · Trustworthy', industries: 'Finance, legal, logistics', price: 'Standard', status: 'Published',\n    compatible: ['Two-colour palettes', 'Icon contact blocks'], incompatible: ['Centred signatures', 'Letterpress'] },\n  { name: 'Ghost wordmark bleed', slug: 'bg.mark.ghost-bleed', version: '1.4', next: '1.5', personality: 'Bold · Creative · Youthful', industries: 'Marketing, creator, hospitality', price: 'Standard', status: 'Published',\n    compatible: ['Full ink coverage', 'Spot UV'], incompatible: ['Uncoated cotton', 'Letterpress', 'Legal, government'] },\n  { name: 'Technical grid field', slug: 'bg.pattern.tech-grid', version: '2.0', next: '2.1', personality: 'Futuristic · Tech · Minimal', industries: 'Technology, manufacturing', price: 'Standard', status: 'Published',\n    compatible: ['Mono typography', 'Dark grounds', 'Soft-touch'], incompatible: ['Luxury serif header', 'Gold foil'] },\n  { name: 'Edge-painted stock', slug: 'fin.stock.edge-paint', version: '1.1', next: '1.2', personality: 'Luxury · Exclusive', industries: 'Fashion, hospitality, consulting', price: 'Luxury', status: 'Draft',\n    compatible: ['600 gsm cotton', 'Letterpress'], incompatible: ['Standard stocks', 'Lamination'] },\n  { name: 'QR-forward back', slug: 'lay.back.qr-forward', version: '3.2', next: '3.3', personality: 'Modern · Tech · Friendly', industries: 'Technology, retail, creator', price: 'Basic', status: 'Review',\n    compatible: ['High-contrast palettes', 'Sans systems'], incompatible: ['Dark grounds under 60% contrast', 'Foil over the code'] }\n];\nconst LAYOUT_ALTS = [['Rule and name', 'rule'], ['Centred signature', 'centered'], ['Split panel', 'split'], ['Full bleed', 'bleed'], ['Editorial', 'editorial'], ['Technical grid', 'grid'], ['Colour band', 'band'], ['Corner monogram', 'corner'], ['Ruled stack', 'stack'], ['Framed centre', 'frame'], ['Duotone panel', 'duotone'], ['Index card', 'index']];\nconst EXTRA_TEMPLATES = [\n  { id: 't7', num: '07', name: 'Signal Band', layout: 'band', bg: '#ffffff', fg: '#16202b', accent: '#ec3013', muted: '#7f8790', hair: '#dcdfe2', panel: '#ec3013', font: \"'Space Grotesk', sans-serif\", back: 'contact',\n    blurb: 'A colour band across the top third, everything else quiet.', typeName: 'Geometric sans', finishRec: 'Matte lamination', finishShort: 'Matte', complexity: 'Low complexity', fit: 82, why: 'One saturated area does the work of a logo when there is no logo to place.' },\n  { id: 't8', num: '08', name: 'Corner Monogram', layout: 'corner', bg: '#14213d', fg: '#f2f4f8', accent: '#c8a45c', muted: '#8892a6', hair: '#2a3350', font: \"'Playfair Display', serif\", back: 'mark',\n    blurb: 'An oversized initial running off the corner, contact set small and low.', typeName: 'Luxury serif', finishRec: 'Soft-touch + foil', finishShort: 'Foil', complexity: 'High complexity', fit: 86, why: 'The monogram is the only element allowed to break the grid.' },\n  { id: 't9', num: '09', name: 'Ruled Stack', layout: 'stack', bg: '#f7f6f3', fg: '#1c1b19', accent: '#2f6f5b', muted: '#84817b', hair: '#cfccc5', panel: '#2f6f5b', font: \"'Space Grotesk', sans-serif\", back: 'contact',\n    blurb: 'Every field separated by a hairline. Nothing hierarchical is left to chance.', typeName: 'Geometric sans', finishRec: 'Uncoated, no laminate', finishShort: 'Uncoated', complexity: 'Low complexity', fit: 80, why: 'Rules do the organising, so the type can stay one size and stay readable.' },\n  { id: 't10', num: '10', name: 'Framed Centre', layout: 'frame', bg: '#fbf9f4', fg: '#232019', accent: '#8a1c1c', muted: '#8d887d', hair: '#c9c3b6', font: \"'DM Serif Display', serif\", back: 'mark',\n    blurb: 'A thin rule frame, centred type, generous margin — traditional without being dated.', typeName: 'Editorial serif', finishRec: 'Letterpress', finishShort: 'Letterpress', complexity: 'High complexity', fit: 78, why: 'The frame gives a card with almost no content something to hold on to.' },\n  { id: 't11', num: '11', name: 'Duotone Panel', layout: 'duotone', bg: '#ffffff', fg: '#191919', accent: '#ff5a1f', muted: '#7d7d7d', hair: '#e2e2e2', panel: '#191919', font: \"'Archivo', sans-serif\", back: 'qr',\n    blurb: 'A narrow ink panel down one side carrying the mark and the city.', typeName: 'Grotesk display', finishRec: 'Spot UV on the panel', finishShort: 'Spot UV', complexity: 'Medium complexity', fit: 84, why: 'A vertical pa
